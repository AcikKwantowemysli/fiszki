# Pełny kod HTML – wszystkie słówka

<!DOCTYPE html>

<style>

  text-align:center;
}

h1{
  color:#333;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}

button, select{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#6c63ff;
  color:white;
  font-size:16px;
  cursor:pointer;
}

#card{
  background:white;
  max-width:700px;
  margin:auto;
  padding:40px 20px;
  border-radius:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
}

.small{
  font-size:18px;
  color:#666;
  margin-top:10px;
}

#controls{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:10px;
}

#quiz, #list{
  max-width:700px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

#quiz input{
  width:90%;
  padding:12px;
  font-size:16px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

ul{
  text-align:left;
}

@media(max-width:600px){

  #card{
    font-size:22px;
    padding:30px 15px;
  }

  button, select{
    width:100%;
    font-size:15px;
  }

  .toolbar{
    flex-direction:column;
  }
}
</style>

<body>

</div>

<script>

const fiszki = [

// Lektion 6

];

let filtered = [...fiszki];
let history = [];
let currentIndex = 0;
let showAnswer = false;
let mode = 'flashcards';
let direction = 'DE2PL';

const cardEl = document.getElementById('card');
const listEl = document.getElementById('list');
const quizEl = document.getElementById('quiz');
const quizQuestionEl = document.getElementById('quizQuestion');
const quizInputEl = document.getElementById('quizInput');
const quizFeedbackEl = document.getElementById('quizFeedback');

function applyFilter(){
const val = document.getElementById('lessonFilter').value;
filtered = val === 'all'
? [...fiszki]
: fiszki.filter(f => String(f.lesson) === val);
currentIndex = 0;
renderCurrentCard();
if(mode === 'list') renderList();
}

function setMode(m){
mode = m;
cardEl.style.display = 'none';
quizEl.style.display = 'none';
listEl.style.display = 'none';
document.getElementById('controls').style.display = 'none';

if(m === 'flashcards'){
cardEl.style.display = 'flex';
document.getElementById('controls').style.display = 'flex';
renderCurrentCard();
}

if(m === 'quiz'){
quizEl.style.display = 'block';
newQuiz();
}

if(m === 'list'){
listEl.style.display = 'block';
renderList();
}
}

function renderCurrentCard(){
if(filtered.length === 0){
cardEl.textContent = 'Brak słówek';
return;
}

const item = filtered[currentIndex];
const front = direction === 'DE2PL' ? item.de : item.pl;
const back = direction === 'DE2PL' ? item.pl : item.de;

cardEl.innerHTML = `
<div>
<div>${front}</div>
${showAnswer
? `<div class="small">${back}</div>`
: `<div class="small">Kliknij aby pokazać tłumaczenie</div>`}
</div>`;
}

function toggleDirection(){
direction = direction === 'DE2PL' ? 'PL2DE' : 'DE2PL';
const btn = document.querySelector('button[onclick="toggleDirection()"]');
btn.textContent = direction === 'DE2PL' ? 'DE → PL' : 'PL → DE';
renderCurrentCard();
if(mode === 'quiz') newQuiz();
}

function nextCard(){
history.push(currentIndex);
currentIndex = Math.floor(Math.random()*filtered.length);
showAnswer = false;
renderCurrentCard();
}

function prevCard(){
if(history.length > 0){
currentIndex = history.pop();
}
showAnswer = false;
renderCurrentCard();
}

cardEl.addEventListener('click', ()=>{
showAnswer = !showAnswer;
renderCurrentCard();
});

function newQuiz(){
currentIndex = Math.floor(Math.random()*filtered.length);
const item = filtered[currentIndex];

quizQuestionEl.textContent = direction === 'DE2PL'
? `Przetłumacz na polski: ${item.de}`
: `Przetłumacz na niemiecki: ${item.pl}`;

quizInputEl.value = '';
quizFeedbackEl.textContent = '';
}

function normalize(s){
return s.trim().toLowerCase().replace(/\s+/g,' ');
}

function checkAnswer(){
const user = normalize(quizInputEl.value);
const correct = direction === 'DE2PL'
? normalize(filtered[currentIndex].pl)
: normalize(filtered[currentIndex].de);

if(user === correct){
quizFeedbackEl.textContent = '✔️ Dobrze!';
} else {
quizFeedbackEl.textContent = `❌ Poprawna odpowiedź: ${direction === 'DE2PL' ? filtered[currentIndex].pl : filtered[currentIndex].de}`;
}

setTimeout(newQuiz, 1500);
}

function renderList(){
let html = '<h2>Lista słówek</h2><ul>';
filtered.forEach(f => {
html += `<li><b>${f.de}</b> — ${f.pl}</li>`;
});
html += '</ul>';
listEl.innerHTML = html;
}

applyFilter();
setMode('flashcards');

</script>

</body>
</html>
